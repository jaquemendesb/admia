version: "3.7"

# =============================================================================
# ADMIA — Docker Swarm Stack
# Plataforma de governança administrativa do ecossistema Prof Jaque Mendes.
#
# Deploy via Portainer (recomendado) ou CLI:
#   docker stack deploy -c docker/docker-stack.yml admia
#
# Após o primeiro deploy, execute no container:
#   npx prisma migrate deploy
#   SEED_ADMIN_EMAIL=... SEED_ADMIN_PASSWORD=... npx prisma db seed
# =============================================================================

services:
  admia:
    image: jaquemendesb/admia:latest  # Imagem publicada via GitHub Actions no Docker Hub

    # ── Variáveis de ambiente ─────────────────────────────────────────────────
    # NÃO coloque valores reais aqui — este arquivo está no GitHub público.
    # Preencha os valores no Portainer em "Environment variables".
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}           # postgresql://user:pass@host:5432/pjm_automation_ai
      - NEXTAUTH_URL=${NEXTAUTH_URL}           # https://admia.jaquemendes.com
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}     # openssl rand -base64 32
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}       # openssl rand -base64 32 — criptografa credenciais de integração
      - RUNTIME_API_KEY=${RUNTIME_API_KEY}     # openssl rand -base64 32 — autenticação dos endpoints /api/runtime/*

    # ── Health check ──────────────────────────────────────────────────────────
    # Swarm só considera o container saudável após /api/health retornar 200.
    # Usa node (já disponível na imagem) — wget não está instalado no Alpine.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - pjm-network  # Rede overlay compartilhada com Traefik, WAHA, LiteLLM e Chatwoot

    # ── Configuração do Swarm ─────────────────────────────────────────────────
    deploy:
      mode: replicated
      replicas: 1

      placement:
        constraints:
          - node.role == manager  # Garante execução no nó manager onde o Traefik está

      resources:
        limits:
          cpus: "1"
          memory: 512M

      restart_policy:
        condition: any   # Reinicia automaticamente em qualquer falha
        delay: 10s
        max_attempts: 3

      # ── Traefik — roteamento e TLS ─────────────────────────────────────────
      labels:
        - traefik.enable=true
        - traefik.docker.network=pjm-network

        # Roteamento: apenas requisições para admia.jaquemendes.com
        - traefik.http.routers.admia.rule=Host(`admia.jaquemendes.com`)
        - traefik.http.routers.admia.entrypoints=websecure
        - traefik.http.routers.admia.tls.certresolver=letsencryptresolver  # TLS automático via Let's Encrypt
        - traefik.http.routers.admia.service=admia

        # Porta interna do Next.js
        - traefik.http.services.admia.loadbalancer.server.port=3000
        - traefik.http.services.admia.loadbalancer.passHostHeader=true

# ── Redes ─────────────────────────────────────────────────────────────────────
networks:
  pjm-network:
    external: true   # Rede já existente — criada pelo stack do Traefik
    name: pjm-network
